# PostgreSQL configuration for Yarah

# Listen on all interfaces to allow container connections
listen_addresses = '*'

# Kept for logical-replication tooling; changing wal_level needs a restart.
# Unused today — realtime uses pg_notify, not logical decoding.
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10

# Shared preload libraries
shared_preload_libraries = 'pg_cron,http,pgcrypto,yarah_pg_utils'

# Both default to 'project_admin' inside yarah_pg_utils. Pinned here so the
# value is visible and can't shift when the extension is rebuilt.
yarah.policy_grant_role = 'project_admin'
yarah.extension_grant_role = 'project_admin'
yarah.policy_grant_tables = 'storage.objects,realtime.channels,realtime.messages,payments.stripe_checkout_sessions,payments.stripe_customer_portal_sessions,payments.razorpay_orders,payments.razorpay_subscriptions'

# Yarah-internal schemas that must never be exposed to the REST data API.
# Read by system.is_exposed_schema (migration 056) to decide PostgREST's
# db_schemas allowlist. Comma-separated, no spaces. Postgres internals (pg_*,
# information_schema) and extension-owned schemas are handled separately and
# need not be listed here. Edit + `SELECT pg_reload_conf()` to apply at runtime.
yarah.internal_schemas = 'ai,auth,compute,deployments,email,functions,memory,payments,realtime,schedules,storage,system'

cron.database_name = 'yarah' # Add this line to specify the database for pg_cron
